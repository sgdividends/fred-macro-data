name: Crisis Dashboard

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 30 min after FRED Series Daily Fetch
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Fetch extra FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_crisis_series.py
      - name: Build dashboard
        run: python scripts/crisis_dashboard.py
      - name: Commit
        run: |
          git config user.name "fred-data-bot"
          git config user.email "actions@github.com"
          git add data/fred/ data/finra_margin/ reports/
          git diff --staged --quiet || git commit -m "Crisis dashboard update"
          git pull --rebase
          git push
