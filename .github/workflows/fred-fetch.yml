name: FRED Series Daily Fetch

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13:00 UTC (9:00am ET / 9:00pm SGT), weekdays only
  workflow_dispatch: {}       # Manual trigger button in GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run FRED fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fred_fetch.py

      - name: Commit updated caches
        run: |
          git config user.name "fred-data-bot"
          git config user.email "actions@github.com"
          git add data/fred/
          git diff --staged --quiet || git commit -m "Daily FRED series update"
          git push
